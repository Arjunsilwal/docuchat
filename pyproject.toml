[project]
name = "docuchat"
version = "0.1.0"
description = "A RAG chatbot with hybrid retrieval, citations and Recall@K evaluation"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]  # zip(strict=...) adds noise here